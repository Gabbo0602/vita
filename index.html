<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vita</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vita">
<meta name="theme-color" content="#f6f3ee">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f6f3ee; --panel:#fffdf9; --ink:#1f1d1a; --muted:#77716a; --line:#e6e0d6;
  --accent:#2f5d50; --accent-soft:#e3ece8; --warn:#b5562f; --warn-soft:#f6e5dc; --gold:#b98a2a;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#161513;--panel:#1f1e1b;--ink:#efebe4;--muted:#a19a90;--line:#33302b;--accent:#7fb8a5;--accent-soft:#25332e;--warn:#e08a63;--warn-soft:#3a2820;--gold:#d8ae54}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:ui-serif,'New York',Georgia,serif;font-weight:600;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:var(--panel);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh}
.brand{font-family:ui-serif,'New York',Georgia,serif;font-size:26px;font-weight:700;padding:0 10px 4px}
.brand small{display:block;font:500 12px -apple-system,system-ui,sans-serif;color:var(--muted)}
nav a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none;margin:2px 0;font-weight:500}
nav a:hover{background:var(--bg)}
nav a.on{background:var(--accent-soft);color:var(--accent)}
nav .ico{width:20px;text-align:center}
.sync{position:absolute;bottom:18px;left:24px;right:14px;font-size:12px;color:var(--muted)}
main{padding:28px clamp(16px,4vw,48px) 90px;max-width:1150px;width:100%}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.head h1{font-size:32px}
.head p{margin:2px 0 0;color:var(--muted)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer}
@media (prefers-color-scheme:dark){.btn{color:#10201b}}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--warn)}
.btn.sm{padding:5px 10px;font-size:13px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h3{font-size:18px;margin-bottom:10px}
.stat .n{font-family:ui-serif,'New York',Georgia,serif;font-size:34px;font-weight:700;line-height:1}
.stat .l{color:var(--muted);font-size:13px;margin-top:4px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:500}
.row .s{color:var(--muted);font-size:13px}
.done .t{text-decoration:line-through;color:var(--muted)}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);background:none;cursor:pointer;flex:none;display:grid;place-items:center;color:#fff;font-size:13px}
.chk.on{background:var(--accent);border-color:var(--accent)}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.tag.p-alta{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.late{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.icon-btn{background:none;border:0;cursor:pointer;color:var(--muted);padding:4px 6px;border-radius:6px}
.icon-btn:hover{background:var(--bg);color:var(--ink)}
.empty{color:var(--muted);padding:14px 0;font-size:14px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:13px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.goal .ms{margin:10px 0 0;padding:0;list-style:none}
.goal .ms li{display:flex;gap:8px;align-items:center;padding:4px 0;font-size:14px}
.goal .ms li .chk{width:18px;height:18px;border-radius:5px;font-size:11px}
.addms{display:flex;gap:6px;margin-top:8px}
.addms input{flex:1;border:1px solid var(--line);border-radius:8px;padding:5px 9px;background:var(--bg)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dh{font-size:12px;color:var(--muted);text-align:center;padding:4px 0;font-weight:600}
.cal .d{min-height:84px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px;cursor:pointer;font-size:12px;overflow:hidden}
.cal .d.out{opacity:.4}
.cal .d.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cal .d.sel{background:var(--accent-soft)}
.cal .d b{font-weight:600}
.cal .ev{display:block;background:var(--accent);color:#fff;border-radius:5px;padding:1px 5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
.cal .tk{display:block;color:var(--warn);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (prefers-color-scheme:dark){.cal .ev{color:#10201b}}
/* habits */
.hab{display:grid;grid-template-columns:minmax(120px,1fr) repeat(7,34px) 60px 28px;gap:6px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.hab.h{border-top:0;font-size:12px;color:var(--muted);text-align:center}
.hab .cell{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.hab .cell.on{background:var(--accent);border-color:var(--accent)}
.streak{font-size:13px;color:var(--gold);font-weight:600;text-align:center}
textarea.journal{width:100%;min-height:280px;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel);resize:vertical;line-height:1.6}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.ov.open{display:flex}
.modal{background:var(--panel);border-radius:16px;padding:22px;width:min(480px,100%);max-height:90vh;overflow:auto;border:1px solid var(--line)}
.modal h2{font-size:22px;margin-bottom:14px}
.f{display:grid;gap:4px;margin-bottom:12px}
.f label{font-size:12.5px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--bg);width:100%}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.actions .sp{flex:1}
.quote{font-family:ui-serif,'New York',Georgia,serif;font-size:17px;color:var(--muted);font-style:italic}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;z-index:30;max-width:92vw;box-shadow:0 6px 24px rgba(0,0,0,.25);font-weight:500}
.note{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:12px}
.note.w{background:var(--warn-soft)}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  main{padding-top:calc(env(safe-area-inset-top) + 18px);padding-bottom:calc(env(safe-area-inset-bottom) + 90px)}
  .f input,.f select,.f textarea{font-size:16px}
  nav{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;display:flex;justify-content:space-around;padding:6px 4px calc(env(safe-area-inset-bottom) + 6px);border-right:0;border-top:1px solid var(--line);z-index:10}
  nav .brand,.sync{display:none}
  nav a{flex-direction:column;gap:0;font-size:10px;padding:5px 4px;flex:1}
  nav .lbl{display:block!important}
  nav .ico{font-size:19px}
  .hab{grid-template-columns:minmax(90px,1fr) repeat(7,28px) 44px 24px;gap:4px}
  .hab .cell{width:28px;height:28px}
  .cal .d{min-height:58px}
  .cal .ev{font-size:0;height:6px;padding:0}
}
</style>
</head>
<body>
<div class="app">
  <nav id="nav">
    <div class="brand">Vita<small>la tua vita, in ordine</small></div>
    <a href="#oggi" data-v="oggi"><span class="ico">☀︎</span><span class="lbl">Oggi</span></a>
    <a href="#obiettivi" data-v="obiettivi"><span class="ico">◎</span><span class="lbl">Obiettivi</span></a>
    <a href="#impegni" data-v="impegni"><span class="ico">✓</span><span class="lbl">Impegni</span></a>
    <a href="#agenda" data-v="agenda"><span class="ico">▦</span><span class="lbl">Agenda</span></a>
    <a href="#abitudini" data-v="abitudini"><span class="ico">↻</span><span class="lbl">Abitudini</span></a>
    <a href="#diario" data-v="diario"><span class="ico">✎</span><span class="lbl">Diario</span></a>
    <a href="#altro" data-v="altro"><span class="ico">⚙︎</span><span class="lbl">Altro</span></a>
    <div class="sync" id="sync">Dati salvati solo su questo dispositivo</div>
  </nav>
  <main id="view"></main>
</div>
<div class="ov" id="ov"><div class="modal" id="modal"></div></div>

<script>
const AREE=["Lavoro","Salute","Famiglia","Finanze","Crescita","Svago","Casa"];
const GIORNI=["Lun","Mar","Mer","Gio","Ven","Sab","Dom"];
const MESI=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const LS="vita-app-v1";
let S={goals:[],tasks:[],events:[],habits:[],journal:{}};
let ui={taskFilter:"aperti",goalArea:"Tutte",calY:null,calM:null,selDay:null,jDay:null};

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>iso(new Date());
const parse=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
function fmt(s,long){if(!s)return"";const d=parse(s);const t=today();
  if(s===t)return"oggi";if(s===addDays(t,1))return"domani";if(s===addDays(t,-1))return"ieri";
  return d.getDate()+" "+MESI[d.getMonth()].slice(0,long?20:3)+(d.getFullYear()!==new Date().getFullYear()?" "+d.getFullYear():"")}
function daysTo(s){return Math.round((parse(s)-parse(today()))/864e5)}
function goalProgress(g){
  const ms=g.milestones||[];const tk=S.tasks.filter(t=>t.goalId===g.id);
  const tot=ms.length+tk.length;if(!tot)return g.done?100:0;
  return Math.round((ms.filter(m=>m.done).length+tk.filter(t=>t.done).length)/tot*100)}
function streak(h){let n=0,d=today();if(!h.log[d])d=addDays(d,-1);while(h.log[d]){n++;d=addDays(d,-1)}return n}

/* ---------- persistence (solo su questo telefono) ---------- */
function loadLocal(){try{const r=localStorage.getItem(LS);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
  S.notified=S.notified||{};S.settings=S.settings||{taskHour:"09:00"}}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast("Memoria piena: fai un backup ed elimina voci vecchie")}}
function setSync(){}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* ---------- toast ---------- */
function toast(msg,ms=4000){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}

/* ---------- promemoria ---------- */
const REM=[["","nessuno"],["0","all'ora esatta"],["10","10 min prima"],["30","30 min prima"],["60","1 ora prima"],["120","2 ore prima"],["1440","1 giorno prima"]];
const remOpts=sel=>REM.map(([v,l])=>`<option value="${v}" ${v===(sel??"")?"selected":""}>${l}</option>`).join("");
function evStart(e){const[h,m]=(e.time||"09:00").split(":").map(Number);const d=parse(e.date);d.setHours(h,m,0,0);return d}
function dueReminders(){
  const out=[],now=Date.now();
  S.events.forEach(e=>{if(e.remind===""||e.remind==null)return;const at=evStart(e).getTime()-Number(e.remind)*6e4;
    if(at<=now&&evStart(e).getTime()>now-36e5)out.push({k:"e"+e.id+"@"+e.date+e.time+e.remind,title:"📅 "+e.title,body:(e.time?"Alle "+e.time:fmt(e.date))+(e.place?" · "+e.place:"")})});
  S.tasks.forEach(t=>{if(t.done||!t.due||!t.remind)return;const[h,m]=(t.time||S.settings.taskHour||"09:00").split(":").map(Number);const d=parse(t.due);d.setHours(h,m,0,0);
    if(d.getTime()<=now)out.push({k:"t"+t.id+"@"+t.due,title:"✓ "+t.title,body:t.due<today()?"Impegno scaduto":"Da fare oggi"})});
  return out.filter(r=>!S.notified[r.k]);
}
async function notify(r){
  try{if("Notification"in window&&Notification.permission==="granted"){const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();
    if(reg){await reg.showNotification(r.title,{body:r.body,icon:"icon-192.png",tag:r.k});return}new Notification(r.title,{body:r.body});return}}catch(e){}
  toast(r.title+" — "+r.body,6000);
}
function checkReminders(){const due=dueReminders();if(!due.length)return;due.forEach(r=>{S.notified[r.k]=Date.now();notify(r)});
  const cut=Date.now()-60*864e5;for(const k in S.notified)if(S.notified[k]<cut)delete S.notified[k];save()}
async function askNotif(){
  if(!("Notification"in window)){openModal(`<h2>Notifiche</h2><p>Su iPhone le notifiche funzionano solo dopo aver aggiunto Vita alla schermata Home (Safari → Condividi → <b>Aggiungi alla schermata Home</b>) e aprendola da lì.</p><div class="actions"><button class="btn" onclick="closeModal()">Ok</button></div>`);return}
  const p=await Notification.requestPermission();toast(p==="granted"?"Notifiche attivate ✓":"Notifiche non consentite");render()}

/* ---------- Calendario iPhone (.ics) ---------- */
const icsEsc=s=>String(s||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/[,;]/g,m=>"\\"+m);
const icsDT=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"T"+pad(d.getHours())+pad(d.getMinutes())+"00";
function icsEvent(e){
  const st=evStart(e);let en;if(e.end){const[h,m]=e.end.split(":").map(Number);en=new Date(st);en.setHours(h,m)}if(!en||en<=st)en=new Date(st.getTime()+36e5);
  const L=["BEGIN:VEVENT","UID:"+e.id+"@vita","DTSTAMP:"+icsDT(new Date()),e.time?"DTSTART:"+icsDT(st):"DTSTART;VALUE=DATE:"+e.date.replace(/-/g,""),
    e.time?"DTEND:"+icsDT(en):"DTEND;VALUE=DATE:"+addDays(e.date,1).replace(/-/g,""),"SUMMARY:"+icsEsc(e.title)];
  if(e.place)L.push("LOCATION:"+icsEsc(e.place));if(e.notes)L.push("DESCRIPTION:"+icsEsc(e.notes));
  if(e.remind!==""&&e.remind!=null)L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(e.title),"TRIGGER:-PT"+Number(e.remind)+"M","END:VALARM");
  L.push("END:VEVENT");return L;
}
function icsTask(t){const[h,m]=(t.time||S.settings.taskHour||"09:00").split(":").map(Number);const st=parse(t.due);st.setHours(h,m);
  return icsEvent({id:"t"+t.id,title:"✓ "+t.title,date:t.due,time:pad(h)+":"+pad(m),end:"",place:"",notes:t.notes,remind:"0"})}
function shareICS(lines,name){
  const txt=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Vita//IT","CALSCALE:GREGORIAN",...lines,"END:VCALENDAR"].join("\r\n");
  const file=new File([txt],name+".ics",{type:"text/calendar"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).catch(()=>{});return}
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name+".ics";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000);
}
function calOne(id){const e=S.events.find(x=>x.id===id);if(e)shareICS(icsEvent(e),e.title.replace(/[^\w ]/g,"").slice(0,30)||"appuntamento")}
function calAll(){const t=today();const ev=S.events.filter(e=>e.date>=t).flatMap(icsEvent);const tk=S.tasks.filter(x=>!x.done&&x.due&&x.due>=t&&x.remind).flatMap(icsTask);
  if(!ev.length&&!tk.length){toast("Nessun appuntamento futuro da esportare");return}shareICS([...ev,...tk],"Vita-agenda")}

/* ---------- backup ---------- */
function backup(){const blob=new File([JSON.stringify(S,null,1)],"vita-backup-"+today()+".json",{type:"application/json"});
  if(navigator.canShare&&navigator.canShare({files:[blob]})){navigator.share({files:[blob]}).catch(()=>{});return}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=blob.name;document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),2000)}
function restore(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.tasks||!d.goals)throw 0;
  confirmBox("Il backup sostituirà tutti i dati attuali.",()=>{S=Object.assign({goals:[],tasks:[],events:[],habits:[],journal:{},notified:{},settings:{taskHour:"09:00"}},d);save();render();toast("Backup ripristinato ✓")},"Ripristina")}catch(e){toast("File non valido")}};r.readAsText(f)}

/* ---------- modal ---------- */
function openModal(html){$("#modal").innerHTML=html;$("#ov").classList.add("open");if(matchMedia("(pointer:fine)").matches){const f=$("#modal input,#modal textarea");f&&f.focus()}}
function closeModal(){$("#ov").classList.remove("open")}
$("#ov").addEventListener("mousedown",e=>{if(e.target.id==="ov")closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
function confirmBox(msg,fn,lbl="Elimina"){openModal(`<h2>Sei sicuro?</h2><p>${esc(msg)}</p><div class="actions"><button class="btn ghost" onclick="closeModal()">Annulla</button><button class="btn danger" id="okc">${lbl}</button></div>`);$("#okc").onclick=()=>{closeModal();fn()}}
const areaOpts=sel=>AREE.map(a=>`<option ${a===sel?"selected":""}>${a}</option>`).join("");
const goalOpts=sel=>`<option value="">— nessuno —</option>`+S.goals.filter(g=>!g.done||g.id===sel).map(g=>`<option value="${g.id}" ${g.id===sel?"selected":""}>${esc(g.title)}</option>`).join("");

function editGoal(id){
  const g=S.goals.find(x=>x.id===id)||{title:"",area:"Crescita",why:"",deadline:""};
  openModal(`<h2>${id?"Modifica obiettivo":"Nuovo obiettivo"}</h2>
  <form id="fm"><div class="f"><label>Obiettivo</label><input name="title" required value="${esc(g.title)}" placeholder="Es. Correre una mezza maratona"></div>
  <div class="f2"><div class="f"><label>Area</label><select name="area">${areaOpts(g.area)}</select></div>
  <div class="f"><label>Scadenza</label><input type="date" name="deadline" value="${g.deadline||""}"></div></div>
  <div class="f"><label>Perché è importante</label><textarea name="why" rows="3">${esc(g.why)}</textarea></div>
  ${id?"":`<div class="f"><label>Tappe (una per riga)</label><textarea name="ms" rows="3" placeholder="Correre 5 km&#10;Correre 10 km"></textarea></div>`}
  <div class="actions">${id?`<button type="button" class="btn ghost" id="del">Elimina</button><span class="sp"></span>`:""}<button type="button" class="btn ghost" onclick="closeModal()">Annulla</button><button class="btn">Salva</button></div></form>`);
  $("#fm").onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
    if(id)Object.assign(g,{title:f.title,area:f.area,deadline:f.deadline,why:f.why});
    else S.goals.push({id:uid(),title:f.title,area:f.area,deadline:f.deadline,why:f.why,done:false,created:today(),
      milestones:(f.ms||"").split("\n").map(s=>s.trim()).filter(Boolean).map(t=>({id:uid(),t,done:false}))});
    closeModal();save();render()};

/* ---------- actions ---------- */
function toggleTask(id){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  t.done=!t.done;t.doneAt=t.done?today():"";
  if(t.done&&t.repeat){
    const base=t.due||today();let nd;
    if(t.repeat==="daily")nd=addDays(base,1);else if(t.repeat==="weekly")nd=addDays(base,7);
    else{const d=parse(base);d.setMonth(d.getMonth()+1);nd=iso(d)}
    S.tasks.push(Object.assign({},t,{id:uid(),done:false,doneAt:"",due:nd}));t.repeat="";
  }
  save();render();
}
function toggleMs(gid,mid){const g=S.goals.find(x=>x.id===gid);const m=g.milestones.find(x=>x.id===mid);m.done=!m.done;save();render()}
function delMs(gid,mid){const g=S.goals.find(x=>x.id===gid);g.milestones=g.milestones.filter(x=>x.id!==mid);save();render()}
function addMs(gid,inp){const v=inp.value.trim();if(!v)return;S.goals.find(x=>x.id===gid).milestones.push({id:uid(),t:v,done:false});save();render()}
function toggleGoalDone(id){const g=S.goals.find(x=>x.id===id);g.done=!g.done;save();render()}
function toggleHabit(id,d){const h=S.habits.find(x=>x.id===id);if(h.log[d])delete h.log[d];else h.log[d]=true;save();render()}
function quickTask(inp){const v=inp.value.trim();if(!v)return;S.tasks.push({id:uid(),title:v,due:today(),priority:"media",area:"Lavoro",goalId:"",notes:"",done:false,created:today()});save();render();setTimeout(()=>$("#qt")&&$("#qt").focus(),0)}

/* ---------- views ---------- */
function taskRow(t,showDue=true){

   ${t.repeat?`<span class="tag">↻</span> `:""}${t.remind?`<span class="tag">🔔${t.time?" "+esc(t.time):""}</span> `:""}<span class="tag">${esc(t.area||"")}</span>
   ${g?` · ◎ ${esc(g.title)}`:""}</div></div>
  <button class="icon-btn" onclick="editTask('${t.id}')" aria-label="Modifica">✎</button></div>`;

function eventRow(e){

function vImpegni(){

  <div class="grid" style="grid-template-columns:minmax(0,2fr) minmax(220px,1fr)" id="agwrap">
  <div><p class="quote">Com'è andata ${d===today()?"oggi":"il "+fmt(d,true)}? Per cosa sei grato? Cosa farai meglio domani?</p>
  <textarea class="journal" id="jt" placeholder="Scrivi liberamente…">${esc(S.journal[d]||"")}</textarea></div>
  <div class="card"><h3>Voci recenti</h3>${recent.map(k=>`<div class="row" style="cursor:pointer" onclick="ui.jDay='${k}';render()"><div class="main"><div class="t" style="text-transform:capitalize">${fmt(k,true)}</div><div class="s" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(S.journal[k].slice(0,80))}</div></div></div>`).join("")||`<div class="empty">Ancora nessuna voce.</div>`}</div></div>`;
}

function vAltro(){
  const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
  const perm="Notification"in window?Notification.permission:"non disponibile";
  return `<div class="head"><div><h1>Impostazioni</h1><p>Notifiche, calendario e backup. I tuoi dati restano solo su questo telefono.</p></div></div>
  <div class="grid g2">
  <div class="card"><h3>📲 Installazione</h3>${standalone?`<div class="note">✓ Vita è installata sulla schermata Home e funziona anche senza internet.</div>`:
   `<div class="note w">Per usarla come un'app: apri questa pagina in <b>Safari</b>, tocca <b>Condividi</b> (il quadrato con la freccia) → <b>Aggiungi alla schermata Home</b>. Poi aprila sempre dall'icona.</div>`}</div>
  <div class="card"><h3>🔔 Notifiche</h3>
   <p style="font-size:14px;margin-top:0">Stato: <b>${perm==="granted"?"attive":perm==="denied"?"bloccate (riattivale da Impostazioni iPhone → Notifiche → Vita)":perm==="default"?"non ancora attivate":"disponibili solo dall'app installata"}</b></p>
   ${perm!=="granted"&&perm!=="denied"?`<button class="btn" onclick="askNotif()">Attiva notifiche</button>`:""}
   <p style="font-size:13px;color:var(--muted)">Le notifiche di Vita arrivano quando l'app è aperta o appena la riapri. Per avvisi garantiti anche ad app chiusa, aggiungi gli appuntamenti al Calendario iPhone (sotto o con il tasto 📅).</p>
   <div class="f" style="max-width:220px"><label>Ora promemoria impegni senza orario</label><input type="time" value="${S.settings.taskHour||"09:00"}" onchange="S.settings.taskHour=this.value||'09:00';save()"></div></div>
  <div class="card"><h3>📅 Calendario iPhone</h3><p style="font-size:14px;margin-top:0">Esporta tutti gli appuntamenti futuri (e gli impegni con promemoria) con i loro avvisi. Nel foglio che si apre scegli <b>Aggiungi tutti</b> / Calendario.</p>
   <button class="btn" onclick="calAll()">Esporta nel Calendario</button></div>
  <div class="card"><h3>💾 Backup</h3><p style="font-size:14px;margin-top:0">Salva una copia dei dati (ad es. in File o iCloud Drive). Fallo ogni tanto: se cancelli l'app o i dati di Safari, il backup è l'unico modo per recuperarli.</p>
   <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="backup()">Crea backup</button><label class="btn ghost" style="cursor:pointer">Ripristina<input type="file" accept=".json,application/json" style="display:none" onchange="restore(this)"></label></div>
   <p style="font-size:12.5px;color:var(--muted)">${S.goals.length} obiettivi · ${S.tasks.length} impegni · ${S.events.length} appuntamenti · ${S.habits.length} abitudini · ${Object.keys(S.journal).length} pagine di diario</p></div>
  </div>`;
}

/* ---------- router ---------- */
const VIEWS={oggi:vOggi,obiettivi:vObiettivi,impegni:vImpegni,agenda:vAgenda,abitudini:vAbitudini,diario:vDiario,altro:vAltro};
function cur(){const h=location.hash.slice(1);return VIEWS[h]?h:"oggi"}
function render(){
  const v=cur();$("#view").innerHTML=VIEWS[v]();
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.v===v));
  const jt=$("#jt");if(jt)jt.addEventListener("input",()=>{S.journal[ui.jDay]=jt.value;save(true)});
  const w=$("#agwrap");if(w&&innerWidth<860)w.style.gridTemplateColumns="1fr";
}
addEventListener("hashchange",()=>{render();scrollTo(0,0)});
loadLocal();render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
checkReminders();setInterval(checkReminders,30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){checkReminders();render()}});
let lastDay=today();setInterval(()=>{if(today()!==lastDay){lastDay=today();render()}},60000);
</script>
</body>
</html>
