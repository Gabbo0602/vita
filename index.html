<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vita</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vita">
<meta name="theme-color" content="#f6f3ee">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f6f3ee; --panel:#fffdf9; --ink:#1f1d1a; --muted:#77716a; --line:#e6e0d6;
  --accent:#2f5d50; --accent-soft:#e3ece8; --warn:#b5562f; --warn-soft:#f6e5dc; --gold:#b98a2a;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#161513;--panel:#1f1e1b;--ink:#efebe4;--muted:#a19a90;--line:#33302b;--accent:#7fb8a5;--accent-soft:#25332e;--warn:#e08a63;--warn-soft:#3a2820;--gold:#d8ae54}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:ui-serif,'New York',Georgia,serif;font-weight:600;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:var(--panel);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh}
.brand{font-family:ui-serif,'New York',Georgia,serif;font-size:26px;font-weight:700;padding:0 10px 4px}
.brand small{display:block;font:500 12px -apple-system,system-ui,sans-serif;color:var(--muted)}
nav a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none;margin:2px 0;font-weight:500}
nav a:hover{background:var(--bg)}
nav a.on{background:var(--accent-soft);color:var(--accent)}
nav .ico{width:20px;text-align:center}
.sync{position:absolute;bottom:18px;left:24px;right:14px;font-size:12px;color:var(--muted)}
main{padding:28px clamp(16px,4vw,48px) 90px;max-width:1150px;width:100%}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.head h1{font-size:32px}
.head p{margin:2px 0 0;color:var(--muted)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer}
@media (prefers-color-scheme:dark){.btn{color:#10201b}}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--warn)}
.btn.sm{padding:5px 10px;font-size:13px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h3{font-size:18px;margin-bottom:10px}
.stat .n{font-family:ui-serif,'New York',Georgia,serif;font-size:34px;font-weight:700;line-height:1}
.stat .l{color:var(--muted);font-size:13px;margin-top:4px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:500}
.row .s{color:var(--muted);font-size:13px}
.done .t{text-decoration:line-through;color:var(--muted)}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);background:none;cursor:pointer;flex:none;display:grid;place-items:center;color:#fff;font-size:13px}
.chk.on{background:var(--accent);border-color:var(--accent)}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.tag.p-alta{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.late{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.icon-btn{background:none;border:0;cursor:pointer;color:var(--muted);padding:4px 6px;border-radius:6px}
.icon-btn:hover{background:var(--bg);color:var(--ink)}
.empty{color:var(--muted);padding:14px 0;font-size:14px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:13px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.goal .ms{margin:10px 0 0;padding:0;list-style:none}
.goal .ms li{display:flex;gap:8px;align-items:center;padding:4px 0;font-size:14px}
.goal .ms li .chk{width:18px;height:18px;border-radius:5px;font-size:11px}
.addms{display:flex;gap:6px;margin-top:8px}
.addms input{flex:1;border:1px solid var(--line);border-radius:8px;padding:5px 9px;background:var(--bg)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dh{font-size:12px;color:var(--muted);text-align:center;padding:4px 0;font-weight:600}
.cal .d{min-height:84px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px;cursor:pointer;font-size:12px;overflow:hidden}
.cal .d.out{opacity:.4}
.cal .d.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cal .d.sel{background:var(--accent-soft)}
.cal .d b{font-weight:600}
.cal .ev{display:block;background:var(--accent);color:#fff;border-radius:5px;padding:1px 5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
.cal .tk{display:block;color:var(--warn);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (prefers-color-scheme:dark){.cal .ev{color:#10201b}}
/* habits */
.hab{display:grid;grid-template-columns:minmax(120px,1fr) repeat(7,34px) 60px 28px;gap:6px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.hab.h{border-top:0;font-size:12px;color:var(--muted);text-align:center}
.hab .cell{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.hab .cell.on{background:var(--accent);border-color:var(--accent)}
.streak{font-size:13px;color:var(--gold);font-weight:600;text-align:center}
textarea.journal{width:100%;min-height:280px;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel);resize:vertical;line-height:1.6}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.ov.open{display:flex}
.modal{background:var(--panel);border-radius:16px;padding:22px;width:min(480px,100%);max-height:90vh;overflow:auto;border:1px solid var(--line)}
.modal h2{font-size:22px;margin-bottom:14px}
.f{display:grid;gap:4px;margin-bottom:12px}
.f label{font-size:12.5px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--bg);width:100%}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.actions .sp{flex:1}
.quote{font-family:ui-serif,'New York',Georgia,serif;font-size:17px;color:var(--muted);font-style:italic}
.money{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.money.in{color:var(--accent)}.money.out{color:var(--warn)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.seg label{flex:1;text-align:center;padding:8px;cursor:pointer;font-weight:600;font-size:14px}
.seg input{display:none}
.seg label:has(input:checked){background:var(--accent-soft);color:var(--accent)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;z-index:30;max-width:92vw;box-shadow:0 6px 24px rgba(0,0,0,.25);font-weight:500}
.note{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:12px}
.note.w{background:var(--warn-soft)}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  main{padding-top:calc(env(safe-area-inset-top) + 18px);padding-bottom:calc(env(safe-area-inset-bottom) + 90px)}
  .f input,.f select,.f textarea{font-size:16px}
  nav{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;display:flex;justify-content:space-around;padding:6px 4px calc(env(safe-area-inset-bottom) + 6px);border-right:0;border-top:1px solid var(--line);z-index:10}
  nav .brand,.sync{display:none}
  nav a{flex-direction:column;gap:0;font-size:10px;padding:5px 4px;flex:1}
  nav .lbl{display:block!important}
  nav .ico{font-size:19px}
  .hab{grid-template-columns:minmax(90px,1fr) repeat(7,28px) 44px 24px;gap:4px}
  .hab .cell{width:28px;height:28px}
  .cal .d{min-height:58px}
  .cal .ev{font-size:0;height:6px;padding:0}
}
</style>
</head>
<body>
<div class="app">
  <nav id="nav">
    <div class="brand">Vita<small>la tua vita, in ordine</small></div>
    <a href="#oggi" data-v="oggi"><span class="ico">☀︎</span><span class="lbl">Oggi</span></a>
    <a href="#obiettivi" data-v="obiettivi"><span class="ico">◎</span><span class="lbl">Obiettivi</span></a>
    <a href="#impegni" data-v="impegni"><span class="ico">✓</span><span class="lbl">Impegni</span></a>
    <a href="#agenda" data-v="agenda"><span class="ico">▦</span><span class="lbl">Agenda</span></a>
    <a href="#abitudini" data-v="abitudini"><span class="ico">↻</span><span class="lbl">Abitudini</span></a>
    <a href="#soldi" data-v="soldi"><span class="ico">€</span><span class="lbl">Soldi</span></a>
    <a href="#diario" data-v="diario"><span class="ico">✎</span><span class="lbl">Diario</span></a>
    <a href="#altro" data-v="altro"><span class="ico">⚙︎</span><span class="lbl">Altro</span></a>
    <div class="sync" id="sync"></div>
  </nav>
  <main id="view"></main>
</div>
<div class="ov" id="ov"><div class="modal" id="modal"></div></div>

<script>
const AREE=["Lavoro","Salute","Famiglia","Finanze","Crescita","Svago","Casa"];
const GIORNI=["Lun","Mar","Mer","Gio","Ven","Sab","Dom"];
const MESI=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const LS="vita-app-v1";
let S={goals:[],tasks:[],events:[],habits:[],journal:{},accounts:[],txs:[]};
let ui={taskFilter:"aperti",goalArea:"Tutte",calY:null,calM:null,selDay:null,jDay:null};

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>iso(new Date());
const parse=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
function fmt(s,long){if(!s)return"";const d=parse(s);const t=today();
  if(s===t)return"oggi";if(s===addDays(t,1))return"domani";if(s===addDays(t,-1))return"ieri";
  return d.getDate()+" "+MESI[d.getMonth()].slice(0,long?20:3)+(d.getFullYear()!==new Date().getFullYear()?" "+d.getFullYear():"")}
function daysTo(s){return Math.round((parse(s)-parse(today()))/864e5)}
function goalProgress(g){
  const ms=g.milestones||[];const tk=S.tasks.filter(t=>t.goalId===g.id);
  const tot=ms.length+tk.length;if(!tot)return g.done?100:0;
  return Math.round((ms.filter(m=>m.done).length+tk.filter(t=>t.done).length)/tot*100)}
function streak(h){let n=0,d=today();if(!h.log[d])d=addDays(d,-1);while(h.log[d]){n++;d=addDays(d,-1)}return n}

/* ---------- persistence (solo su questo telefono) ---------- */
function loadLocal(){try{const r=localStorage.getItem(LS);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
  S.notified=S.notified||{};S.accounts=S.accounts||[];S.txs=S.txs||[];S.settings=S.settings||{taskHour:"09:00"}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast("Memoria piena: fai un backup ed elimina voci vecchie")}}
function save(journalChanged){saveLocal();if(Cloud.push&&Cloud.user)Cloud.push(!!journalChanged)}
/* ---------- ponte verso la sincronizzazione (sync.js) ---------- */
const Cloud=window.Cloud={user:null,ready:false,push:null,text:"",
  getState:()=>S,
  status(t){this.text=t;const e=$("#sync");if(e)e.textContent=t?"☁️ "+t:"";const s=$("#syncState");if(s)s.textContent=t},
  onUser(){const j=$("#jt");if(!(j&&document.activeElement===j))render()},
  applyRemote(main,journal,money){
    if(main){const m=JSON.parse(JSON.stringify(main));delete m.updatedAt;
      S=Object.assign({goals:[],tasks:[],events:[],habits:[]},m,{journal:S.journal,accounts:S.accounts,txs:S.txs,notified:S.notified,settings:m.settings||S.settings})}
    if(journal)S.journal=JSON.parse(JSON.stringify(journal));
    if(money){const m=JSON.parse(JSON.stringify(money));S.accounts=m.accounts||[];S.txs=m.txs||[]}
    saveLocal();const j=$("#jt");if(!(j&&document.activeElement===j))render()}
};
Cloud.ensureToken=function(){S.settings=S.settings||{taskHour:"09:00"};if(!S.settings.inboxToken){const a=new Uint8Array(24);crypto.getRandomValues(a);S.settings.inboxToken=[...a].map(x=>x.toString(16).padStart(2,"0")).join("");save()}};
Cloud.applyInbox=function(code){const items=parseVita(code);const r=applyItems(items);if(r.n){save();const j=$("#jt");if(!(j&&document.activeElement===j))render();notify({k:"inbox"+Date.now(),title:"🤖 Da Claude",body:items.map(x=>describeItem(x).replace(/<[^>]+>/g,"")).slice(0,3).join(" · ")})}};
async function copyKey(){const k=S.settings.inboxToken;try{await navigator.clipboard.writeText(k);toast("Chiave copiata ✓")}catch(e){openModal(`<h2>Chiave per Claude</h2><p style="font-size:13px">Tieni premuto e copia:</p><textarea rows="3" readonly style="width:100%">${k}</textarea><div class="actions"><button class="btn" onclick="closeModal()">Ok</button></div>`)}}
function newKey(){confirmBox("Creo una nuova chiave: quella vecchia smetterà di funzionare e dovrai dare a Claude quella nuova.",()=>{delete S.settings.inboxToken;Cloud.ensureToken();Cloud.startInbox&&Cloud.startInbox();render();toast("Nuova chiave creata")},"Cambia chiave")}
async function doAuth(kind){
  const em=($("#aEmail")||{}).value?.trim(),pw=($("#aPw")||{}).value||"";const out=$("#aMsg");
  const say=t=>{if(out)out.textContent=t};
  if(!Cloud.ready){say("Sincronizzazione non disponibile: serve internet la prima volta.");return}
  if(!em){say("Scrivi la tua email.");return}
  try{
    if(kind==="reset"){await Cloud.reset(em);say("Ti ho mandato un'email per reimpostare la password.");return}
    if(pw.length<6){say("La password deve avere almeno 6 caratteri.");return}
    say("Attendi…");
    if(kind==="up")await Cloud.signUp(em,pw);else await Cloud.signIn(em,pw);
    toast("Accesso effettuato ✓ I dati ora si sincronizzano");
  }catch(e){const c=e.code||"";say(c.includes("invalid-credential")||c.includes("wrong-password")||c.includes("user-not-found")?"Email o password non corrette.":c.includes("email-already-in-use")?"Esiste già un account con questa email: usa Accedi.":c.includes("invalid-email")?"Email non valida.":c.includes("network")?"Serve la connessione a internet.":"Errore: "+c)}
}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* ---------- toast ---------- */
function toast(msg,ms=4000){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}

/* ---------- promemoria ---------- */
const REM=[["","nessuno"],["0","all'ora esatta"],["10","10 min prima"],["30","30 min prima"],["60","1 ora prima"],["120","2 ore prima"],["1440","1 giorno prima"]];
const remOpts=sel=>REM.map(([v,l])=>`<option value="${v}" ${v===(sel??"")?"selected":""}>${l}</option>`).join("");
function evStart(e){const[h,m]=(e.time||"09:00").split(":").map(Number);const d=parse(e.date);d.setHours(h,m,0,0);return d}
function dueReminders(){
  const out=[],now=Date.now();
  S.events.forEach(e=>{if(e.remind===""||e.remind==null)return;const at=evStart(e).getTime()-Number(e.remind)*6e4;
    if(at<=now&&evStart(e).getTime()>now-36e5)out.push({k:"e"+e.id+"@"+e.date+e.time+e.remind,title:"📅 "+e.title,body:(e.time?"Alle "+e.time:fmt(e.date))+(e.place?" · "+e.place:"")})});
  S.tasks.forEach(t=>{if(t.done||!t.due||!t.remind)return;const[h,m]=(t.time||S.settings.taskHour||"09:00").split(":").map(Number);const d=parse(t.due);d.setHours(h,m,0,0);
    if(d.getTime()<=now)out.push({k:"t"+t.id+"@"+t.due,title:"✓ "+t.title,body:t.due<today()?"Impegno scaduto":"Da fare oggi"})});
  return out.filter(r=>!S.notified[r.k]);
}
async function notify(r){
  try{if("Notification"in window&&Notification.permission==="granted"){const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();
    if(reg){await reg.showNotification(r.title,{body:r.body,icon:"icon-192.png",tag:r.k});return}new Notification(r.title,{body:r.body});return}}catch(e){}
  toast(r.title+" — "+r.body,6000);
}
function checkReminders(){const due=dueReminders();if(!due.length)return;due.forEach(r=>{S.notified[r.k]=Date.now();notify(r)});
  const cut=Date.now()-60*864e5;for(const k in S.notified)if(S.notified[k]<cut)delete S.notified[k];save()}
async function askNotif(){
  if(!("Notification"in window)){openModal(`<h2>Notifiche</h2><p>Su iPhone le notifiche funzionano solo dopo aver aggiunto Vita alla schermata Home (Safari → Condividi → <b>Aggiungi alla schermata Home</b>) e aprendola da lì.</p><div class="actions"><button class="btn" onclick="closeModal()">Ok</button></div>`);return}
  const p=await Notification.requestPermission();toast(p==="granted"?"Notifiche attivate ✓":"Notifiche non consentite");render()}

/* ---------- Calendario iPhone (.ics) ---------- */
const icsEsc=s=>String(s||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/[,;]/g,m=>"\\"+m);
const icsDT=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"T"+pad(d.getHours())+pad(d.getMinutes())+"00";
function icsEvent(e){
  const st=evStart(e);let en;if(e.end){const[h,m]=e.end.split(":").map(Number);en=new Date(st);en.setHours(h,m)}if(!en||en<=st)en=new Date(st.getTime()+36e5);
  const L=["BEGIN:VEVENT","UID:"+e.id+"@vita","DTSTAMP:"+icsDT(new Date()),e.time?"DTSTART:"+icsDT(st):"DTSTART;VALUE=DATE:"+e.date.replace(/-/g,""),
    e.time?"DTEND:"+icsDT(en):"DTEND;VALUE=DATE:"+addDays(e.date,1).replace(/-/g,""),"SUMMARY:"+icsEsc(e.title)];
  if(e.place)L.push("LOCATION:"+icsEsc(e.place));if(e.notes)L.push("DESCRIPTION:"+icsEsc(e.notes));
  if(e.remind!==""&&e.remind!=null)L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(e.title),"TRIGGER:-PT"+Number(e.remind)+"M","END:VALARM");
  L.push("END:VEVENT");return L;
}
function icsTask(t){const[h,m]=(t.time||S.settings.taskHour||"09:00").split(":").map(Number);const st=parse(t.due);st.setHours(h,m);
  return icsEvent({id:"t"+t.id,title:"✓ "+t.title,date:t.due,time:pad(h)+":"+pad(m),end:"",place:"",notes:t.notes,remind:"0"})}
function shareICS(lines,name){
  const txt=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Vita//IT","CALSCALE:GREGORIAN",...lines,"END:VCALENDAR"].join("\r\n");
  const file=new File([txt],name+".ics",{type:"text/calendar"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).catch(()=>{});return}
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name+".ics";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000);
}
function calOne(id){const e=S.events.find(x=>x.id===id);if(e)shareICS(icsEvent(e),e.title.replace(/[^\w ]/g,"").slice(0,30)||"appuntamento")}

function backup(){const blob=new File([JSON.stringify(S,null,1)],"vita-backup-"+today()+".json",{type:"application/json"});
  if(navigator.canShare&&navigator.canShare({files:[blob]})){navigator.share({files:[blob]}).catch(()=>{});return}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=blob.name;document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),2000)}
function restore(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.tasks||!d.goals)throw 0;
  confirmBox("Il backup sostituirà tutti i dati attuali.",()=>{S=Object.assign({goals:[],tasks:[],events:[],habits:[],journal:{},accounts:[],txs:[],notified:{},settings:{taskHour:"09:00"}},d);save(true);render();toast("Backup ripristinato ✓")},"Ripristina")}catch(e){toast("File non valido")}};r.readAsText(f)}

/* ---------- actions ---------- */
function toggleTask(id){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  t.done=!t.done;t.doneAt=t.done?today():"";
  if(t.done&&t.repeat){
    const base=t.due||today();let nd;
    if(t.repeat==="daily")nd=addDays(base,1);else if(t.repeat==="weekly")nd=addDays(base,7);
    else{const d=parse(base);d.setMonth(d.getMonth()+1);nd=iso(d)}
    S.tasks.push(Object.assign({},t,{id:uid(),done:false,doneAt:"",due:nd}));t.repeat="";
  }
  save();render();
}
function toggleMs(gid,mid){const g=S.goals.find(x=>x.id===gid);const m=g.milestones.find(x=>x.id===mid);m.done=!m.done;save();render()}
function delMs(gid,mid){const g=S.goals.find(x=>x.id===gid);g.milestones=g.milestones.filter(x=>x.id!==mid);save();render()}
function addMs(gid,inp){const v=inp.value.trim();if(!v)return;S.goals.find(x=>x.id===gid).milestones.push({id:uid(),t:v,done:false});save();render()}
function toggleGoalDone(id){const g=S.goals.find(x=>x.id===id);g.done=!g.done;save();render()}
function toggleHabit(id,d){const h=S.habits.find(x=>x.id===id);if(h.log[d])delete h.log[d];else h.log[d]=true;save();render()}
function quickTask(inp){const v=inp.value.trim();if(!v)return;S.tasks.push({id:uid(),title:v,due:today(),priority:"media",area:"Lavoro",goalId:"",notes:"",done:false,created:today()});save();render();setTimeout(()=>$("#qt")&&$("#qt").focus(),0)}

function vAgenda(){
  const now=new Date();if(ui.calY===null){ui.calY=now.getFullYear();ui.calM=now.getMonth()}
  if(!ui.selDay)ui.selDay=today();
  const first=new Date(ui.calY,ui.calM,1);const start=new Date(first);start.setDate(1-((first.getDay()+6)%7));
  let cells="";for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const s=iso(d);

const CAT_OUT=["Spesa","Casa","Bollette","Trasporti","Auto","Salute","Ristoranti","Svago","Abbigliamento","Regali","Viaggi","Abbonamenti","Tasse","Altro"];
const CAT_IN=["Stipendio","Extra","Rimborsi","Regali","Vendite","Interessi","Altro"];
const ACC_TYPES=[["banca","🏦 Conto"],["contanti","💶 Contanti"],["carta","💳 Carta/prepagata"],["risparmio","🐷 Risparmi"],["altro","📦 Altro"]];
const eur=n=>new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR"}).format(n||0);
const num=v=>{let s=String(v??"").trim().replace(/\s|€/g,"");if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");const n=parseFloat(s);return isFinite(n)?Math.round(n*100)/100:0};
const numIn=v=>v===""||v==null?"":String(v).replace(".",",");
function accBalance(a){let b=Number(a.initial)||0;S.txs.forEach(t=>{const m=Number(t.amount)||0;
  if(t.type==="in"&&t.acc===a.id)b+=m;else if(t.type==="out"&&t.acc===a.id)b-=m;else if(t.type==="tr"){if(t.acc===a.id)b-=m;if(t.to===a.id)b+=m}});return Math.round(b*100)/100}
const accName=id=>(S.accounts.find(a=>a.id===id)||{name:"—"}).name;
const accIcon=t=>(ACC_TYPES.find(x=>x[0]===t)||["","📦"])[1].split(" ")[0];
ui.mY=null;ui.mM=null;ui.txFilter="tutti";
function editAccount(id){
  const a=S.accounts.find(x=>x.id===id)||{name:"",type:"banca",initial:""};
  openModal(`<h2>${id?"Modifica conto":"Nuovo conto"}</h2><form id="fm">
  <div class="f"><label>Nome</label><input name="name" required value="${esc(a.name)}" placeholder="Es. Conto Intesa, Portafoglio, Hype…"></div>

  ${id?`<p style="font-size:13px;color:var(--muted)">Saldo calcolato oggi: <b>${eur(accBalance(a))}</b>. Se non corrisponde usa “Allinea saldo”.</p>`:""}
  <div class="actions">${id?`<button type="button" class="btn ghost" id="del">Elimina</button><button type="button" class="btn ghost" id="fix">Allinea saldo</button><span class="sp"></span>`:""}<button type="button" class="btn ghost" onclick="closeModal()">Annulla</button><button class="btn">Salva</button></div></form>`);
  $("#fm").onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));

    if(id)Object.assign(a,o);else S.accounts.push(Object.assign({id:uid()},o));closeModal();save();render()};
  if(id){$("#del").onclick=()=>{const n=S.txs.filter(t=>t.acc===id||t.to===id).length;
      confirmBox(n?`Il conto ha ${n} movimenti: verranno eliminati anche quelli.`:"Eliminare il conto?",()=>{S.accounts=S.accounts.filter(x=>x.id!==id);S.txs=S.txs.filter(t=>t.acc!==id&&t.to!==id);save();render()})};
    $("#fix").onclick=()=>{openModal(`<h2>Allinea saldo</h2><p style="font-size:14px">Scrivi quanto c'è davvero oggi su <b>${esc(a.name)}</b>: creo un movimento di correzione.</p><form id="fx"><div class="f"><label>Saldo reale (€)</label><input name="v" inputmode="decimal" required value="${numIn(accBalance(a))}"></div><div class="actions"><button type="button" class="btn ghost" onclick="closeModal()">Annulla</button><button class="btn">Allinea</button></div></form>`);

function editTx(id,preset={}){
  if(!S.accounts.length){openModal(`<h2>Prima crea un conto</h2><p>Aggiungi almeno un conto (es. il conto in banca o i contanti) per registrare i movimenti.</p><div class="actions"><button class="btn ghost" onclick="closeModal()">Annulla</button><button class="btn" onclick="editAccount()">+ Conto</button></div>`);return}
  const def=(S.accounts.find(a=>a.type==="banca")||S.accounts[0]).id;
  const t=S.txs.find(x=>x.id===id)||Object.assign({type:"out",date:today(),amount:"",acc:def,to:"",cat:"Spesa",note:""},preset);
  const accOpts=sel=>S.accounts.map(a=>`<option value="${a.id}" ${a.id===sel?"selected":""}>${accIcon(a.type)} ${esc(a.name)}</option>`).join("");
  const otherAcc=(S.accounts.find(a=>a.id!==t.acc)||{}).id;
  openModal(`<h2>${id?"Modifica movimento":"Nuovo movimento"}</h2><form id="fm">
  <div class="seg">${[["out","− Uscita"],["in","+ Entrata"],["tr","⇄ Giroconto"]].map(([v,l])=>`<label><input type="radio" name="type" value="${v}" ${t.type===v?"checked":""}><span>${l}</span></label>`).join("")}</div>
  <div class="f2"><div class="f"><label>Importo (€)</label><input name="amount" inputmode="decimal" required value="${numIn(t.amount)}" placeholder="0,00"></div>
  <div class="f"><label>Data</label><input type="date" name="date" required value="${t.date}"></div></div>
  <div class="f2"><div class="f"><label id="lAcc">Conto</label><select name="acc">${accOpts(t.acc)}</select></div>
  <div class="f" id="fCat"><label>Categoria</label><select name="cat"></select></div>
  <div class="f" id="fTo"><label>Verso il conto</label><select name="to">${accOpts(t.to||otherAcc)}</select></div></div>
  <div class="f"><label>Descrizione</label><input name="note" value="${esc(t.note)}" placeholder="Es. Esselunga, affitto, prelievo…"></div>
  <div class="actions">${id?`<button type="button" class="btn ghost" id="del">Elimina</button><span class="sp"></span>`:""}<button type="button" class="btn ghost" onclick="closeModal()">Annulla</button><button class="btn">Salva</button></div></form>`);
  const fm=$("#fm");
  const sync=()=>{const ty=fm.querySelector("input[name=type]:checked").value;$("#fCat").style.display=ty==="tr"?"none":"";$("#fTo").style.display=ty==="tr"?"":"none";
    $("#lAcc").textContent=ty==="tr"?"Dal conto":"Conto";const cats=ty==="in"?CAT_IN:CAT_OUT;const cur=fm.elements.cat.value||t.cat;
    fm.elements.cat.innerHTML=cats.map(c=>`<option ${c===cur?"selected":""}>${c}</option>`).join("")};
  fm.querySelectorAll("input[name=type]").forEach(r=>r.onchange=sync);sync();
  if(matchMedia("(pointer:fine)").matches)fm.elements.amount.focus();
  fm.onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(fm));const amt=Math.abs(num(f.amount));
    if(!amt){toast("Inserisci un importo");return}
    if(f.type==="tr"&&f.to===f.acc){toast("Scegli due conti diversi");return}
    const o={type:f.type,date:f.date,amount:amt,acc:f.acc,to:f.type==="tr"?f.to:"",cat:f.type==="tr"?"":f.cat,note:(f.note||"").trim()};
    if(id)Object.assign(t,o);else S.txs.push(Object.assign({id:uid()},o));closeModal();save();render()};
  if(id)$("#del").onclick=()=>confirmBox("Eliminare questo movimento?",()=>{S.txs=S.txs.filter(x=>x.id!==id);save();render()});

    ${S.accounts.length>1?`<div style="margin-top:10px"><button class="btn sm ghost" onclick="editTx(null,{type:'tr'})">⇄ Giroconto / prelievo</button></div>`:""}</div>

    <div style="display:flex;align-items:center;gap:6px"><button class="btn ghost sm" onclick="mNav(-1)">‹</button><h3 style="margin:0;text-transform:capitalize;min-width:150px;text-align:center">${MESI[ui.mM]} ${ui.mY}</h3><button class="btn ghost sm" onclick="mNav(1)">›</button></div>
    <div class="filters" style="margin:0">${[["tutti","Tutti"],["out","Uscite"],["in","Entrate"],["tr","Giroconti"]].map(([k,l])=>`<button class="chip ${ui.txFilter===k?"on":""}" onclick="ui.txFilter='${k}';render()">${l}</button>`).join("")}</div></div>
   ${list.map(txRow).join("")||`<div class="empty">Nessun movimento in questo mese.</div>`}
  </div>`;
}

/* ---------- IMPORTA DA CLAUDE ---------- */
// Formato: VITA:{"v":1,"add":[{"k":"event"|"task"|"goal"|"habit"|"tx"|"account", "id":"...", ...}]}
function parseVita(txt){
  const i=String(txt||"").indexOf("VITA:");if(i<0)throw new Error("Nel testo non trovo un codice VITA.");
  let s=txt.slice(i+5).trim();const end=s.lastIndexOf("}");if(end<0)throw new Error("Codice incompleto.");s=s.slice(0,end+1);
  s=s.replace(/[“”]/g,'"').replace(/[‘’]/g,"'");
  const d=JSON.parse(s);if(!d||!Array.isArray(d.add))throw new Error("Codice non valido.");return d.add;
}
function findAcc(name){if(!name)return null;const n=String(name).toLowerCase();return S.accounts.find(a=>a.name.toLowerCase()===n)||S.accounts.find(a=>a.name.toLowerCase().includes(n)||n.includes(a.name.toLowerCase()))}
function describeItem(x){
  switch(x.k){
    case"event":return`📅 ${esc(x.title)} — ${fmt(x.date,true)}${x.time?" alle "+esc(x.time):""}${x.place?" · "+esc(x.place):""}`;
    case"task":return`✓ ${esc(x.title)}${x.due?" — entro "+fmt(x.due,true):""}${x.priority==="alta"?" · priorità alta":""}`;
    case"goal":return`◎ ${esc(x.title)}${x.deadline?" — entro "+fmt(x.deadline,true):""}${(x.milestones||[]).length?" · "+x.milestones.length+" tappe":""}`;
    case"habit":return`↻ Abitudine: ${esc(x.name)}`;
    case"account":return`🏦 Conto ${esc(x.name)} — ${eur(num(x.initial))}`;
    case"tx":return`${x.type==="in"?"＋":x.type==="tr"?"⇄":"−"} ${eur(num(x.amount))} ${esc(x.note||x.cat||"")}${x.type==="tr"?` (${esc(x.acc)} → ${esc(x.to)})`:x.acc?" · "+esc(x.acc):""}`;
    default:return"? elemento sconosciuto";
  }
}
function applyItems(items){
  S.imported=S.imported||{};let n=0,skip=0;const t=today();
  items.forEach(x=>{
    const key=x.id||JSON.stringify(x);if(S.imported[key]){skip++;return}
    switch(x.k){
      case"event":S.events.push({id:uid(),title:x.title||"Appuntamento",date:x.date||t,time:x.time||"",end:x.end||"",place:x.place||"",notes:x.notes||"",remind:x.remind==null?"30":String(x.remind)});break;
      case"task":S.tasks.push({id:uid(),title:x.title||"Impegno",due:x.due||"",time:x.time||"",priority:x.priority||"media",area:x.area||"Lavoro",goalId:"",notes:x.notes||"",repeat:x.repeat||"",remind:x.remind?"1":"",done:false,created:t});break;
      case"goal":S.goals.push({id:uid(),title:x.title||"Obiettivo",area:x.area||"Crescita",deadline:x.deadline||"",why:x.why||"",done:false,created:t,milestones:(x.milestones||[]).map(m=>({id:uid(),t:String(m),done:false}))});break;
      case"habit":S.habits.push({id:uid(),name:x.name||"Abitudine",log:{}});break;
      case"account":{const ex=findAcc(x.name);if(ex){ex.initial=num(x.initial)}else S.accounts.push({id:uid(),name:x.name,type:x.type||"banca",initial:num(x.initial)});break}
      case"tx":{const a=findAcc(x.acc)||S.accounts.find(a=>a.type==="banca")||S.accounts[0];if(!a){skip++;return}
        const to=x.type==="tr"?findAcc(x.to):null;
        S.txs.push({id:uid(),type:x.type||"out",date:x.date||t,amount:Math.abs(num(x.amount)),acc:a.id,to:to?to.id:"",cat:x.type==="tr"?"":(x.cat||"Altro"),note:x.note||""});break}
      default:skip++;return;
    }
    S.imported[key]=Date.now();n++;
  });
  return{n,skip};
}
function showImport(txt){
  let items=null,err="";if(txt){try{items=parseVita(txt)}catch(e){err=e.message}}
  openModal(`<h2>📋 Da Claude</h2>
  ${items?`<p style="font-size:14px;margin-top:0">Sto per aggiungere:</p><div style="margin-bottom:12px">${items.map(x=>`<div class="row"><div class="main"><div class="t" style="font-size:14px">${describeItem(x)}</div></div>${S.imported&&S.imported[x.id]?`<span class="tag">già inserito</span>`:""}</div>`).join("")}</div>
   <div class="actions"><button class="btn ghost" onclick="closeModal()">Annulla</button><button class="btn" id="impOk">Aggiungi</button></div>`:
  `<p style="font-size:14px;margin-top:0">Incolla qui il codice che ti ha mandato Claude (inizia con <b>VITA:</b>).</p>
   <div class="f"><textarea id="impTxt" rows="5" placeholder="VITA:{…}"></textarea></div>
   ${err?`<p style="color:var(--warn);font-size:13px">${esc(err)}</p>`:""}
   <div class="actions"><button class="btn ghost" onclick="closeModal()">Annulla</button><button class="btn" id="impGo">Continua</button></div>`}`);
  if(items)$("#impOk").onclick=()=>{const r=applyItems(items);save();closeModal();render();toast(r.n?`Aggiunti ${r.n} elementi ✓${r.skip?` (${r.skip} già presenti)`:""}`:"Niente di nuovo da aggiungere")};
  else $("#impGo").onclick=()=>showImport($("#impTxt").value);
}
async function importFromClaude(){
  try{if(navigator.clipboard&&navigator.clipboard.readText){const t=await navigator.clipboard.readText();if(t&&t.includes("VITA:")){showImport(t);return}}}catch(e){}
  showImport("");
}
